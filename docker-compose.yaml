services:
  app:
    container_name: attendance-app
    image: ghcr.io/amptechnology-dev/attendance_backend:latest
    env_file:
      - .env
    expose:
      - '8001'
    command: sh -c "node src/index.js"
    networks:
      - shared-nginx-net
    restart: unless-stopped

networks:
  shared-nginx-net:
    external: true
    name: amp_portal_backend_app-network